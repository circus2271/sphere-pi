<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Sphere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1011">
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
  <link href="images/webclip.png" rel="apple-touch-icon">
  <style>
    /* Шрифты лежат на самом пирожке: страница работает и без интернета. */
    @font-face { font-family: "Favorit"; src: url("fonts/FavoritPro-Regular.otf") format("opentype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Favorit"; src: url("fonts/FavoritPro-Medium.otf") format("opentype"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Favorit"; src: url("fonts/FavoritPro-Bold.otf") format("opentype"); font-weight: 700; font-display: swap; }

    :root {
      --bg: #0E1011;        /* фон */
      --surface: #171A1C;   /* плитки лайка/дизлайка */
      --btn: #1F2326;       /* круглые кнопки громкости */
      --line: #2D3236;      /* рамки, пустая часть круга */
      --fg: #EEF0F1;        /* основной текст */
      --muted: #8C949A;     /* подписи */
      --accent: #F08A47;    /* оранжевый из логотипа */
      --like: #FF6F83; --like-soft: #3A1F25;
      --dis: #86A6FF;  --dis-soft: #1C2540;
      --ok: #52C985;   --err: #FF7D60; --err-soft: #3A1D16; --wait: #E9C25A;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body {
      font-family: "Favorit", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
      -webkit-text-size-adjust: 100%;
    }
    .page {
      max-width: 440px; margin: 0 auto; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; gap: 14px;
      padding-top: calc(28px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      padding-left: max(18px, env(safe-area-inset-left, 0px));
      padding-right: max(18px, env(safe-area-inset-right, 0px));
    }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { cursor: default; }

    /* ── Шапка: логотип и связь с плеером ── */
    .top { display: grid; justify-items: center; gap: 26px; }
    .logo { width: 128px; height: auto; display: block; }
    .link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .link .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .link[data-link="ok"] .dot { background: var(--ok); }
    .link[data-link="down"] { color: var(--err); }
    .link[data-link="down"] .dot { background: var(--err); }

    /* ── Круг громкости ── */
    .ring { position: relative; width: 260px; max-width: 100%; aspect-ratio: 1; align-self: center; margin-top: -4px; }
    .ring svg { width: 100%; height: 100%; display: block; }
    .ring-track { fill: none; stroke: var(--line); stroke-width: 14; stroke-linecap: round; }
    .ring-value { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; transition: stroke-dasharray .25s ease; }
    body[data-vol="fail"] .ring-value { stroke: var(--err); }
    .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
    .ring-center .k { font-size: 13px; color: var(--muted); }
    #volume { font-size: 68px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; transition: opacity .15s ease; }
    body[data-vol="pending"] #volume { opacity: .45; }
    #volumeNote { font-size: 12.5px; color: var(--muted); min-height: 17px; }
    body[data-vol="fail"] #volumeNote { color: var(--err); }
    body[data-vol="limit"] #volumeNote { color: var(--wait); }
    .vol-buttons { position: absolute; left: 0; right: 0; bottom: -2px; display: flex; justify-content: space-between; }
    .round {
      width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--btn);
      box-shadow: inset 0 0 0 1.5px var(--line), 0 4px 12px rgba(0,0,0,.25);
      display: grid; place-items: center; font-size: 34px; line-height: 1;
      transition: background-color .12s ease, color .12s ease, box-shadow .12s ease, transform .08s ease;
    }
    .round.is-pressed, .round.flash-ok { background: var(--accent); color: #141414; box-shadow: 0 0 0 6px rgba(240,138,71,.25); }
    .round.is-pressed { transform: scale(.94); }
    .round.flash-err { background: var(--err-soft); color: var(--err); box-shadow: inset 0 0 0 1.5px var(--err); }

    /* ── Строка состояния ── */
    #status { text-align: center; font-size: 15px; line-height: 1.35; min-height: 42px; margin-top: auto; padding: 18px 6px 0; color: var(--muted); text-wrap: balance; display: flex; align-items: flex-end; justify-content: center; }
    #status[data-tone="ok"] { color: var(--ok); }
    #status[data-tone="err"] { color: var(--err); }
    #status[data-tone="wait"] { color: var(--wait); }

    /* ── Лайк и дизлайк ── */
    .marks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mark {
      position: relative; border: 0; background: var(--surface); border-radius: 24px; padding: 16px 10px 14px;
      display: grid; justify-items: center; gap: 8px; box-shadow: inset 0 0 0 1.5px var(--line);
      transition: box-shadow .15s ease, transform .08s ease, opacity .15s ease;
    }
    .mark.is-pressed { transform: scale(.96); }
    .mark:disabled { opacity: .45; }
    .circ { position: relative; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; transition: background-color .15s ease, color .15s ease; }
    .mark.like .circ { color: var(--like); background: var(--like-soft); }
    .mark.dislike .circ { color: var(--dis); background: var(--dis-soft); }
    .lab { font-size: 15px; font-weight: 500; }
    .ico { width: 26px; height: 26px; display: block; }
    .st { display: none; }
    .mark[data-state="idle"] .st-idle, .mark[data-state="sending"] .st-sending, .mark[data-state="done"] .st-done, .mark[data-state="fail"] .st-fail { display: block; }

    .mark.like.is-pressed, .mark.like[data-state="done"] { box-shadow: inset 0 0 0 2px var(--like); }
    .mark.like.is-pressed .circ, .mark.like[data-state="done"] .circ { background: var(--like); color: #fff; }
    .mark.dislike.is-pressed, .mark.dislike[data-state="done"] { box-shadow: inset 0 0 0 2px var(--dis); }
    .mark.dislike.is-pressed .circ, .mark.dislike[data-state="done"] .circ { background: var(--dis); color: #fff; }
    .mark[data-state="sending"] { box-shadow: inset 0 0 0 2px var(--wait); }
    .mark[data-state="sending"] .lab { color: var(--wait); }
    .mark[data-state="fail"] { box-shadow: inset 0 0 0 2px var(--err); }
    .mark[data-state="fail"] .circ { background: var(--err-soft); color: var(--err); }
    .mark[data-state="fail"] .lab { color: var(--err); }

    /* анимация «принято»: кружок подпрыгивает, от него расходится волна */
    .mark[data-state="done"] .circ { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
    .mark[data-state="done"] .circ::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid currentColor;
      animation: wave .9s ease-out forwards; pointer-events: none;
    }
    .mark.like[data-state="done"] .circ::after { border-color: var(--like); }
    .mark.dislike[data-state="done"] .circ::after { border-color: var(--dis); }
    .mark[data-state="fail"] { animation: shake .3s ease 2; }
    .round.shake { animation: shake .28s ease 2; }
    .spin { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--wait); border-right-color: transparent; animation: spin .8s linear infinite; }
    #volume.pop { animation: pop .3s ease; }

    /* Большие телефоны: круг громкости крупнее */
    @media (min-height: 720px) {
      .ring { width: 290px; }
      #volume { font-size: 76px; }
    }
    @media (min-height: 820px) {
      .ring { width: 320px; }
      #volume { font-size: 84px; }
      .round { width: 74px; height: 74px; font-size: 36px; }
    }

    /* Маленькие экраны (iPhone SE и похожие): всё помещается без прокрутки */
    @media (max-height: 640px) {
      .page { gap: 10px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
      .top { gap: 18px; }
      .logo { width: 104px; }
      .ring { width: 200px; }
      #volume { font-size: 54px; }
      .round { width: 58px; height: 58px; font-size: 30px; }
      #status { padding-top: 10px; font-size: 14px; }
      .mark { padding: 12px 10px 10px; gap: 6px; }
      .circ { width: 48px; height: 48px; }
    }

    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes wave { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
    }
  </style>
</head>
<body data-vol="idle">
  <main class="page">
    <header class="top">
      <img class="logo" src="images/sphere-sound-studio-logo.svg" alt="Sphere Sound Studio">
      <span class="link" id="link"><span class="dot"></span><span id="linkText">Проверяю связь…</span></span>
    </header>

    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="84" stroke-dasharray="395.84 527.79" transform="rotate(135 100 100)"/>
        <circle class="ring-value" id="ringValue" cx="100" cy="100" r="84" stroke-dasharray="0 527.79" transform="rotate(135 100 100)"/>
      </svg>
      <div class="ring-center">
        <span class="k">громкость</span>
        <span id="volume">—</span>
        <span id="volumeNote"></span>
      </div>
      <div class="vol-buttons">
        <button class="round" id="volumeDown" data-act="volumeDown" aria-label="Тише">−</button>
        <button class="round" id="volumeUp" data-act="volumeUp" aria-label="Громче">+</button>
      </div>
    </div>

    <div id="status" aria-live="polite"></div>

    <div class="marks">
      <button class="mark dislike" id="dislike" data-act="dislike" data-state="idle">
        <span class="circ">
          <svg class="ico st st-idle" viewBox="0 0 37 27" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M2 11.1c.4 5 8.7 11.8 13.6 14.5l-2-7.7 4.7-5.3-2.7-5.8C14.5 4.6 10.7.8 7.5 1.8 3.6 3 1.7 6 2 11.1z"/><path d="M35.5 11.1c-.4 5-8.8 11.8-13.8 14.5l-1.8-6.9 5.4-5.4-3.6-6.6c1.1-2.1 5-5.9 8.2-4.9 4 1.2 5.9 4.3 5.6 9.3z"/></svg>
          <span class="spin st st-sending"></span>
          <svg class="ico st st-done" viewBox="0 0 37 27" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M2 11.1c.4 5 8.7 11.8 13.6 14.5l-2-7.7 4.7-5.3-2.7-5.8C14.5 4.6 10.7.8 7.5 1.8 3.6 3 1.7 6 2 11.1z"/><path d="M35.5 11.1c-.4 5-8.8 11.8-13.8 14.5l-1.8-6.9 5.4-5.4-3.6-6.6c1.1-2.1 5-5.9 8.2-4.9 4 1.2 5.9 4.3 5.6 9.3z"/></svg>
          <svg class="ico st st-fail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6.5"/><path d="M12 17h.01"/></svg>
        </span>
        <span class="lab">Не подходит</span>
      </button>
      <button class="mark like" id="like" data-act="like" data-state="idle">
        <span class="circ">
          <svg class="ico st st-idle" viewBox="0 0 31 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M2 11.4c.4 5.1 8.8 11.8 13.9 14.6 5-2.8 13.4-9.5 13.8-14.6.4-5-1.6-8.1-5.6-9.3-3.2-1-7.1 2.8-8.2 5-1.1-2.2-5-6-8.2-5-4 1.2-6 4.3-5.7 9.3z"/></svg>
          <span class="spin st st-sending"></span>
          <svg class="ico st st-done" viewBox="0 0 31 28" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M2 11.4c.4 5.1 8.8 11.8 13.9 14.6 5-2.8 13.4-9.5 13.8-14.6.4-5-1.6-8.1-5.6-9.3-3.2-1-7.1 2.8-8.2 5-1.1-2.2-5-6-8.2-5-4 1.2-6 4.3-5.7 9.3z"/></svg>
          <svg class="ico st st-fail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6.5"/><path d="M12 17h.01"/></svg>
        </span>
        <span class="lab">Нравится</span>
      </button>
    </div>
  </main>

  <script>
  (function () {
    // ── Настройки ──
    var REQUEST_TIMEOUT = 5000;  // столько ждём ответа плеера, потом пишем «не ответил»
    var MIN_SENDING = 1500;      // «Отправляю…» видно хотя бы столько, даже если плеер ответил мгновенно
    var HOLD = 6000;             // столько держится «принято» или «не дошло», потом кнопка снова обычная
    var CHECK_EVERY = 15000;     // как часто проверяем связь с плеером и громкость

    var TEXT = {
      idle: 'Ждём ваших реакций! Поменять можно, пока трек не доиграл.',
      like:    { idle: 'Нравится',    sending: 'Отправляю…', done: 'Лайк принят',    fail: 'Не дошло' },
      dislike: { idle: 'Не подходит', sending: 'Отправляю…', done: 'Дизлайк принят', fail: 'Не дошло' },
      sending: { like: 'Отправляю лайк…', dislike: 'Отправляю дизлайк…' },
      done: {
        like: 'Лайк принят. Засчитается, когда трек доиграет.',
        dislike: 'Дизлайк принят. Трек доиграет и больше не прозвучит.'
      },
      fail: 'Плеер не ответил. Проверьте, что телефон в Wi‑Fi заведения, и нажмите ещё раз.',
      volumeFail: 'Громкость не изменилась: плеер не ответил. Проверьте, что телефон в Wi‑Fi заведения.'
    };

    var $ = function (id) { return document.getElementById(id); };
    var state = { volume: null, pending: 0, timers: {}, statusTimer: null };

    // ── Связь с плеером ──
    function request(method, url, body) {
      var ctrl = window.AbortController ? new AbortController() : null;
      var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, REQUEST_TIMEOUT);
      var opts = { method: method, cache: 'no-store', signal: ctrl ? ctrl.signal : undefined };
      if (body) { opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' }; opts.body = body; }
      return fetch(url, opts).then(function (r) {
        clearTimeout(t);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        setLink('ok');
        return r.text();
      }, function (e) { clearTimeout(t); setLink('down'); throw e; });
    }
    function send(value) { return request('POST', '/request', 'value=' + encodeURIComponent(value)); }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function setLink(s) {
      $('link').dataset.link = s;
      $('linkText').textContent = s === 'ok' ? 'Плеер на связи' : 'Нет связи с плеером';
    }

    // ── Строка состояния ──
    function setStatus(tone, text, holdMs) {
      clearTimeout(state.statusTimer);
      $('status').dataset.tone = tone || '';
      $('status').textContent = text || TEXT.idle;
      if (holdMs) state.statusTimer = setTimeout(function () { setStatus('', TEXT.idle); }, holdMs);
    }

    // ── Громкость ──
    function showVolume(v, note, mode) {
      if (v !== null) {
        state.volume = v;
        $('volume').textContent = v;
        $('ringValue').setAttribute('stroke-dasharray', (395.84 * v / 100).toFixed(1) + ' 527.79');
      }
      $('volumeNote').textContent = note || '';
      document.body.dataset.vol = mode || 'idle';
    }
    function flash(el, cls) {
      el.classList.remove('flash-ok', 'flash-err', 'shake'); void el.offsetWidth;
      el.classList.add(cls);
      setTimeout(function () { el.classList.remove(cls); }, cls === 'shake' ? 600 : 260);
    }
    function pop(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

    function changeVolume(dir, btn) {
      state.pending++;
      document.body.dataset.vol = 'pending';
      send(dir).then(function (text) {
        state.pending--;
        if (text === 'max' || text === 'min') {
          showVolume(text === 'max' ? 100 : 0, text === 'max' ? 'громче нельзя' : 'звук выключен', 'limit');
          flash(btn, 'shake');
        } else {
          showVolume(Number(text), '', state.pending ? 'pending' : 'idle');
          flash(btn, 'flash-ok');
          pop($('volume'));
        }
      }, function () {
        state.pending--;
        showVolume(null, 'не изменилась', 'fail');
        flash(btn, 'flash-err');
        setStatus('err', TEXT.volumeFail, HOLD);
      });
    }

    function checkPlayer() {
      if (state.pending) return;
      request('GET', '/volumeData').then(function (text) {
        var v = Number(text);
        if (!state.pending && !isNaN(v)) showVolume(v, '', 'idle');
      }, function () {});
    }

    // ── Лайк и дизлайк ──
    function setMark(kind, s) {
      var btn = $(kind);
      btn.dataset.state = s;
      btn.querySelector('.lab').textContent = TEXT[kind][s];
      var other = kind === 'like' ? 'dislike' : 'like';
      $(other).disabled = s === 'sending';
      clearTimeout(state.timers[kind]);
      if (s === 'done' || s === 'fail') {
        state.timers[kind] = setTimeout(function () { setMark(kind, 'idle'); }, HOLD);
      }
    }

    function mark(kind) {
      if ($(kind).dataset.state === 'sending') return;
      var other = kind === 'like' ? 'dislike' : 'like';
      if ($(other).dataset.state !== 'idle') setMark(other, 'idle');
      setMark(kind, 'sending');
      setStatus('wait', TEXT.sending[kind]);
      var started = Date.now();
      var finish = function (ok) {
        return wait(Math.max(0, MIN_SENDING - (Date.now() - started))).then(function () {
          setMark(kind, ok ? 'done' : 'fail');
          if (ok) setStatus('ok', TEXT.done[kind], HOLD);
          else setStatus('err', TEXT.fail, HOLD);
        });
      };
      send(kind).then(function () { return finish(true); }, function () { return finish(false); });
    }

    // ── Нажатия: кнопка окрашивается сразу, в момент касания ──
    Array.prototype.forEach.call(document.querySelectorAll('[data-act]'), function (btn) {
      var downAt = 0;
      btn.addEventListener('pointerdown', function () { if (btn.disabled) return; downAt = Date.now(); btn.classList.add('is-pressed'); });
      var up = function () { setTimeout(function () { btn.classList.remove('is-pressed'); }, Math.max(0, 120 - (Date.now() - downAt))); };
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointerleave', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('click', function () {
        var act = btn.dataset.act;
        if (act === 'volumeUp' || act === 'volumeDown') changeVolume(act, btn);
        else mark(act);
      });
    });

    setStatus('', TEXT.idle);
    checkPlayer();
    setInterval(checkPlayer, CHECK_EVERY);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) checkPlayer(); });
  })();
  </script>
</body>
</html>
